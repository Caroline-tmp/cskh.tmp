<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSKH API Test</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#f3f7fb;color:#17344d;padding:32px}.card{max-width:760px;margin:auto;background:white;border-radius:16px;padding:24px;box-shadow:0 8px 28px #17344d18}.ok{color:#16794b}.bad{color:#b42318}pre{white-space:pre-wrap;background:#f7f9fb;padding:12px;border-radius:10px}</style></head><body><div class="card"><h2>Kiểm tra kết nối Apps Script API</h2><div id="status">Đang kiểm tra...</div><pre id="detail"></pre></div><script>const API='https://script.google.com/macros/s/AKfycbyfcxBwlp3AUVs3y0_Tlu1q2N9YXALQVQdk-IBIL3eGKh8tDyOD4wpy8mHZKOxcVCFc/exec';(async()=>{const s=document.getElementById('status'),d=document.getElementById('detail');try{const r=await fetch(API,{method:'GET',mode:'cors',redirect:'follow',cache:'no-store'});const text=await r.text();if(!r.ok)throw new Error('HTTP '+r.status);let data;try{data=JSON.parse(text)}catch(e){throw new Error('Phản hồi không phải JSON: '+text.slice(0,160))}if(!Array.isArray(data.rows))throw new Error('Payload không có rows[]');s.className='ok';s.textContent='PASS — GitHub Pages đọc được Apps Script API';d.textContent='HTTP: '+r.status+'\nRows: '+data.rows.length+'\nProducts: '+(data.products||[]).length+'\nGeneratedAt: '+(data.generatedAt||'');}catch(e){s.className='bad';s.textContent='FAIL — GitHub Pages chưa đọc được Apps Script API';d.textContent=(e&&e.stack)||String(e);}})();</script></body></html>
